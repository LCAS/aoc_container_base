name: Build a single ROS Docker image (reusable)

on:
  workflow_call:
    inputs:
      base_image:
        description: The FROM base image
        required: true
        type: string
      push_image:
        description: Image name on the LCAS registry
        required: true
        type: string
      tag_stem:
        description: "Base image tag stem (example: humble-11.8)"
        required: true
        type: string
      image_context:
        description: "Tag context suffix (main, release tag, or staging)"
        required: true
        type: string
      ros_distro:
        description: ROS distro to build for (for tags/build args)
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      architectures:
        required: true
        type: string
      build_desktop:
        description: Build a desktop variant after the primary image?
        required: false
        default: false
        type: boolean
      desktop_push_image:
        description: Desktop image name on the LCAS registry, i.e. ros_cuda_desktop
        required: false
        default: ""
        type: string
      no_cache:
        description: Disable the build cache
        required: false
        default: false
        type: boolean
    outputs:
      digest:
        description: Image digest from the build
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      LCAS_REGISTRY_PUSHER:
        required: true
      LCAS_REGISTRY_TOKEN:
        required: true

jobs:
  build:
    runs-on: [lcas, qemu]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: lcas.lincoln.ac.uk
          username: ${{ secrets.LCAS_REGISTRY_PUSHER }}
          password: ${{ secrets.LCAS_REGISTRY_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          labels: |
            org.opencontainers.image.description=AOC Docker Image (${{ inputs.push_image }}, ${{ inputs.ros_distro }})
            org.opencontainers.image.authors=L-CAS Team
          images: lcas.lincoln.ac.uk/${{ inputs.push_image }}
          tags: |
            type=raw,value=${{ inputs.tag_stem }}-${{ inputs.image_context }}
            type=raw,enable=${{ inputs.image_context == 'main' }},value=${{ inputs.tag_stem }}-latest
            type=semver,pattern={{version}},prefix=${{ inputs.tag_stem }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ inputs.tag_stem }}-
            type=semver,pattern={{major}},prefix=${{ inputs.tag_stem }}-

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./${{ inputs.dockerfile }}
          platforms: ${{ inputs.architectures }}
          push: true
          no-cache: ${{ inputs.no_cache }}
          cache-from: ${{ !inputs.no_cache && format('type=registry,ref=lcas.lincoln.ac.uk/cache/{0}:{1}', inputs.push_image, inputs.tag_stem) || '' }}
          cache-to: ${{ !inputs.no_cache && format('type=registry,ref=lcas.lincoln.ac.uk/cache/{0}:{1},mode=max', inputs.push_image, inputs.tag_stem) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            ROS_DISTRO=${{ inputs.ros_distro }}

      #####

      - name: Docker meta desktop
        if: ${{ inputs.build_desktop && inputs.desktop_push_image != '' }}
        id: meta_desktop
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          labels: |
            org.opencontainers.image.description=AOC Docker Image (${{ inputs.desktop_push_image }}, ${{ inputs.ros_distro }} desktop)
            org.opencontainers.image.authors=L-CAS Team
          images: lcas.lincoln.ac.uk/${{ inputs.desktop_push_image }}
          tags: |
            type=raw,value=${{ inputs.tag_stem }}-${{ inputs.image_context }}
            type=raw,enable=${{ inputs.image_context == 'main' }},value=${{ inputs.tag_stem }}-latest
            type=semver,pattern={{version}},prefix=${{ inputs.tag_stem }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ inputs.tag_stem }}-
            type=semver,pattern={{major}},prefix=${{ inputs.tag_stem }}-

      - name: Build and push desktop
        if: ${{ inputs.build_desktop && inputs.desktop_push_image != '' }}
        id: build_desktop
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./desktop.dockerfile
          platforms: ${{ inputs.architectures }}
          push: true
          no-cache: ${{ inputs.no_cache }}
          cache-from: ${{ !inputs.no_cache && format('type=registry,ref=lcas.lincoln.ac.uk/cache/{0}:{1}', inputs.desktop_push_image, inputs.tag_stem) || '' }}
          cache-to: ${{ !inputs.no_cache && format('type=registry,ref=lcas.lincoln.ac.uk/cache/{0}:{1},mode=max', inputs.desktop_push_image, inputs.tag_stem) || '' }}
          tags: ${{ steps.meta_desktop.outputs.tags }}
          labels: ${{ steps.meta_desktop.outputs.labels }}
          build-args: |
            BASE_IMAGE=lcas.lincoln.ac.uk/${{ inputs.push_image }}@${{ steps.build.outputs.digest }}
            ROS_DISTRO=${{ inputs.ros_distro }}

